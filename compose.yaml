services:
  digitalbooking.presentation:
    image: digitalbooking.presentation
    build:
      context: .
      dockerfile: DigitalBooking.Presentation/Dockerfile
  postgres-db:
    container_name: db-postgres
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGUSER: postgres
      PGDATABASE: postgres
    healthcheck:
      test: /usr/bin/pg_isready
      interval: 5s
      timeout: 10s
      retries: 120
    ports:
      - "6432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
