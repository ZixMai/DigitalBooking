name: digital-booking

include:
  - './networks/docker-compose.networks.yml'
  - './postgres/docker-compose.postgres.yml'
  - './postgres/docker-compose.migrator.yml'
  - './s3/docker-compose.s3.yml'
  - './observation/docker-compose.observation.yml'
  - './caddy/docker-compose.caddy.yml'

services:
  digitalbooking.presentation:
    image: digitalbooking.presentation
    container_name: digitalbooking-app
    restart: unless-stopped
    profiles:
      - prod
    env_file:
      - ../example.env
    build:
      context: .
      dockerfile: ../DigitalBooking.Presentation/Dockerfile
    ports:
      - "8080:5223"
    networks:
      - digitalbooking-network
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_healthy