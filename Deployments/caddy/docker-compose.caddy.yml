services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    profiles:
      - prod
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - digitalbooking-caddy:/data
      - digitalbooking-caddy_config:/config
    networks:
      - digitalbooking-network

volumes:
  digitalbooking-caddy:
  digitalbooking-caddy_config: