services:
  migrate:
    build:
      context: ../..
      dockerfile: ./Deployments/postgres/Dockerfile.migrate
    container_name: digitalbooking-migrator
    platform: linux/amd64
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      CONNECTION_STRING: "Host=${DbConfiguration__Server};Port=${DbConfiguration__Port};Database=${DbConfiguration__Database};Username=${DbConfiguration__User};Password=${DbConfiguration__Password};Pooling=${DbConfiguration__Pooling};Minimum Pool Size=${DbConfiguration__MinPoolSize};Maximum Pool Size=${DbConfiguration__MaxPoolSize};Command Timeout=${DbConfiguration__CommandTimeout}"
    networks:
      - digitalbooking-network
    restart: "no"