version: '3.8'

services:
  opensearch:
    container_name: digitalbooking-opensearch
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "9200:9200"
    volumes:
      - digitalbooking-opensearch-data:/usr/share/opensearch/data
    networks:
      - digitalbooking-network

volumes:
  digitalbooking-opensearch-data: