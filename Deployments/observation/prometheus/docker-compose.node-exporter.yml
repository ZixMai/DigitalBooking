services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: digitalbooking-node-exporter
    restart: unless-stopped
    profiles:
      - prod
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.processes
      - --collector.filesystem
      - --collector.cpu
      - --collector.netstat
      - --collector.diskstats
      - --collector.meminfo
    pid: host
    ports:
      - "9101:9100"
    networks:
      - digitalbooking-network