global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Метрики VPS хоста
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'vps-server'

  # Метрики Docker контейнеров (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Метрики приложения из OpenTelemetry Collector
  - job_name: 'otel-collector-metrics'
    static_configs:
      - targets: ['otel-collector:8889']

  # Внутренние метрики самого OpenTelemetry Collector
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  # Метрики Tempo
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
